<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AnonChat</title>
<link rel="stylesheet" href="style.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ============ GERBANG SANDI (tampil pertama) ============ -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>
    </div>
    <h1>Ruang Terkunci</h1>
    <p class="gate-sub">Masukkan kata sandi untuk masuk.</p>
    <p class="gate-hint">Petunjuk: dua nama kembar</p>
    <input id="gate-input" type="password" placeholder="Kata sandi…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="gate-ok" class="gate-btn">Buka</button>
    <p id="gate-error" class="gate-error hidden">Sandi salah. Coba lagi.</p>
  </div>
</div>

<div id="config-warning" class="hidden">
  ⚠️ <b>config.js belum diisi.</b> Buka <code>config.js</code> lalu isi
  <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> — caranya ada di README.md
</div>

<div id="app">
  <!-- ============ SATU LAYAR: LOBBY CHAT ============ -->
  <section id="view-chat" class="view">
    <header class="navbar chatnav">
      <div class="peer">
        <span class="avatar" id="chat-avatar">A</span>
        <span class="peer-meta">
          <small id="chat-status">menghubungkan…</small>
        </span>
      </div>
      <button id="btn-online" class="nav-action" title="Siapa yang online" aria-label="Daftar online">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.7 5.5-4.7s4.9 1.7 5.5 4.7"/><circle cx="16.5" cy="9" r="2.6"/><path d="M15.8 14.7c2.2.3 3.8 1.8 4.3 4.3"/></svg>
        <span id="online-count" class="online-pill hidden">0</span>
      </button>
    </header>

    <!-- panel daftar nama yang online -->
    <div id="online-panel" class="hidden">
      <div class="online-head">Online sekarang</div>
      <div id="online-list"></div>
    </div>

    <div id="messages"></div>

    <form id="composer" autocomplete="off">
      <input id="msg-input" type="text" placeholder="Ketik pesan…" maxlength="2000">
      <button type="submit" id="send-btn" title="Kirim" aria-label="Kirim">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="#fff"><path d="M12 3l7 8h-4v10h-6V11H5z"/></svg>
      </button>
    </form>
  </section>
</div>

<!-- ============ MODAL: ISI NAMA ============ -->
<div class="modal-backdrop" id="modal-nick">
  <div class="modal ios-alert">
    <h2>Selamat datang 👋</h2>
    <p>Tanpa nomor HP. Cukup isi namamu:</p>
    <input id="nick-input" type="text" placeholder="Namamu…" maxlength="24" autocomplete="off">
    <div class="modal-row">
      <button id="nick-ok" class="primary">Mulai Ngobrol</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js?v=5"></script>
</body>
</html>
